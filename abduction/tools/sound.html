<!doctype html>
<!-- tools/sound.mjs's page: renders the take's sound offline and hands it back. -->
<meta charset="utf-8">
<title>sound, offline</title>
<script type="module">
  // ?mix=<module> renders another mix (one with renderTake()) in place of ours.
  const q = new URLSearchParams(location.search);
  const { renderTake } = await import(/* @vite-ignore */ q.get('mix') ?? '../src/audio/mix.js');

  // 16-bit PCM WAV, little-endian, with triangular dither; as base64.
  function wav(buffer) {
    const ch = buffer.numberOfChannels;
    const n = buffer.length;
    const bytes = new Uint8Array(44 + n * ch * 2);
    const v = new DataView(bytes.buffer);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) bytes[o + i] = s.charCodeAt(i); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
    v.setUint32(24, buffer.sampleRate, true); v.setUint32(28, buffer.sampleRate * ch * 2, true);
    v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * ch * 2, true);
    const data = [...Array(ch)].map((_, c) => buffer.getChannelData(c));
    let o = 44;
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < ch; c++) {
        // Dithered, but silence left silent.
        const s = data[c][i] === 0 ? 0 : data[c][i] * 32767 + (Math.random() - Math.random());
        v.setInt16(o, Math.max(-32768, Math.min(32767, Math.round(s))), true);
        o += 2;
      }
    }
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }

  window.__render = async () => {
    const t0 = performance.now();
    const buffer = await renderTake();
    let peak = 0;
    for (let c = 0; c < buffer.numberOfChannels; c++) {
      const d = buffer.getChannelData(c);
      for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    }
    return { wav: wav(buffer), ms: performance.now() - t0, peak };
  };
  window.__ready = true;
</script>
